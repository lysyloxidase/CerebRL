name: Python

on:
  pull_request:
  push:
    branches: [main]

jobs:
  neurons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/neurons pytest ruff pyright
      - name: Ruff
        working-directory: packages/neurons
        run: ruff check .
      - name: Pyright strict
        working-directory: packages/neurons
        run: pyright
      - name: Pytest
        working-directory: packages/neurons
        run: pytest

